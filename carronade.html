<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carronade - Symmetry Cannon Game | Math Adventure Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%9E%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral: #FF6B6B;   --coral-deep: #E14E56;
            --teal: #4ECDC4;    --teal-deep: #2FA79E;
            --purple: #A78BFA;  --purple-deep: #7C5CE0;
            --green: #6BCB77;   --green-deep: #48A857;
            --yellow: #FFD93D;
            --ink: #2D3142;
            --muted: #667085;
            --bg-top: #EAF6FF;
            --bg-bottom: #F5F0FF;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Quicksand', system-ui, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--ink);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Ambient Blobs */
        body::before, body::after {
            content: "";
            position: fixed;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .25;
            z-index: -1;
        }
        body::before { background: var(--teal); top: -100px; left: -150px; }
        body::after { background: var(--purple); bottom: -100px; right: -150px; }

        /* ---------- HEADER ---------- */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(45, 49, 66, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            text-decoration: none;
            color: var(--ink);
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 20px;
            border-radius: 999px;
            box-shadow: 0 4px 0 rgba(45, 49, 66, 0.1);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(45, 49, 66, 0.1); }
        .back-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(45, 49, 66, 0.1); }

        header h1 {
            font-family: 'Baloo 2', sans-serif;
            margin: 0;
            font-size: 1.6rem;
            color: var(--teal-deep);
        }

        /* ---------- MAIN APP AREA ---------- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 950px;
            margin: 0 auto;
            width: 100%;
        }

        .status-bar {
            background: white;
            padding: 12px 25px;
            border-radius: 999px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .score-pill {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .turn-indicator {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 4px 16px;
            border-radius: 999px;
            background: var(--teal);
            color: white;
            transition: background 0.3s;
        }

        /* ---------- PAPER GAMEBOARD ---------- */
        .paper-container {
            position: relative;
            width: 700px;
            height: 480px;
            background: #FAFAFA;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12), inset 0 0 40px rgba(0,0,0,0.02);
            border: 1px solid #E2E8F0;
            cursor: crosshair;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        /* Paper crease down middle */
        .fold-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: repeating-linear-gradient(to bottom, #A0AEC0 0, #A0AEC0 8px, transparent 8px, transparent 16px);
            z-index: 5;
            pointer-events: none;
        }

        .side-label {
            position: absolute;
            top: 15px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            opacity: 0.3;
            pointer-events: none;
        }
        .label-left { left: 20px; color: var(--purple-deep); }
        .label-right { right: 20px; color: var(--coral-deep); }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 3D Paper Fold Animation Layer */
        .fold-overlay {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: #F0F4F8;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 20;
            display: none;
            transform-origin: left center;
            pointer-events: none;
            border-right: 1px solid #CBD5E1;
        }

        /* ---------- CONTROLS & BUTTONS ---------- */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-btn {
            background: white;
            border: none;
            color: var(--ink);
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 10px 24px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(45, 49, 66, 0.1);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(45, 49, 66, 0.1); }
        .game-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(45, 49, 66, 0.1); }

        .game-btn.primary {
            background: var(--coral);
            color: white;
            box-shadow: 0 4px 0 var(--coral-deep);
        }
        .game-btn.primary:hover { box-shadow: 0 6px 0 var(--coral-deep); }
        .game-btn.primary:disabled {
            background: #CBD5E1;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .game-btn.secondary {
            background: var(--purple);
            color: white;
            box-shadow: 0 4px 0 var(--purple-deep);
        }

        /* ---------- CUSTOM MODAL ---------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45, 49, 66, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: white;
            border-radius: 30px;
            padding: 35px 30px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-card h2 {
            font-family: 'Baloo 2', sans-serif;
            font-size: 2.2rem;
            margin: 0 0 10px;
        }
        .modal-card p {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        @media (max-width: 740px) {
            .paper-container { width: 100%; height: 380px; }
            header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Hub
        </a>
        <h1>Carronade - Symmetry Cannon Game</h1>
        <div style="width: 80px;"></div>
    </header>

    <main>
        <div class="status-bar">
            <div class="score-pill" style="color: var(--purple-deep);">
                ⚓ Grogg (You): <span id="player-score">0/5 Sunk</span>
            </div>
            <div class="turn-indicator" id="turn-badge">Your Turn!</div>
            <div class="score-pill" style="color: var(--coral-deep);">
                🏴‍☠️ Winnie (AI): <span id="ai-score">0/5 Sunk</span>
            </div>
        </div>

        <div class="paper-container" id="paper-container">
            <div class="fold-line"></div>
            <div class="side-label label-left">Grogg's Side</div>
            <div class="side-label label-right">Winnie's Side</div>
            
            <canvas id="gameCanvas" width="700" height="480"></canvas>
            
            <!-- Dynamic 3D fold simulation element -->
            <div class="fold-overlay" id="foldOverlay"></div>
        </div>

        <div class="controls">
            <button class="game-btn primary" id="fire-btn" disabled>💥 Fold & Fire!</button>
            <button class="game-btn secondary" id="new-board-btn">🎲 Generate New Board</button>
            <button class="game-btn" id="rules-btn">❓ Instructions</button>
        </div>
    </main>

    <!-- Custom Modal for Instructions & Victory -->
    <div class="modal-overlay" id="modal">
        <div class="modal-card">
            <h2 id="modal-title">Welcome to Carronade!</h2>
            <p id="modal-desc">Click anywhere on Grogg's side (Left) to place a cannonball mark. Then hit <strong>Fold & Fire</strong> to reflect your shot onto Winnie's side!</p>
            <button class="game-btn primary" style="margin: 0 auto;" id="modal-close-btn">Got It!</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const fireBtn = document.getElementById('fire-btn');
        const newBoardBtn = document.getElementById('new-board-btn');
        const rulesBtn = document.getElementById('rules-btn');
        const turnBadge = document.getElementById('turn-badge');
        const playerScoreEl = document.getElementById('player-score');
        const aiScoreEl = document.getElementById('ai-score');
        const foldOverlay = document.getElementById('foldOverlay');
        
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // Game State
        const WIDTH = 700;
        const HEIGHT = 480;
        const MID_X = WIDTH / 2;

        let playerShips = [];
        let aiShips = [];
        let playerShots = []; // {x, y, reflectedX, hit: bool}
        let aiShots = [];     // {x, y, reflectedX, hit: bool}

        let pendingShot = null; // {x, y}
        let isPlayerTurn = true;
        let isAnimating = false;

        // Ship Templates (Outline paths relative to origin)
        const shipTemplates = [
            // Tiny Cutter (Radius ~15)
            [{x:0, y:-12}, {x:10, y:5}, {x:5, y:12}, {x:-5, y:12}, {x:-10, y:5}],
            // Sloop (Radius ~20)
            [{x:0, y:-18}, {x:12, y:4}, {x:8, y:18}, {x:-8, y:18}, {x:-12, y:4}],
            // Brigantine (Radius ~25)
            [{x:0, y:-22}, {x:15, y:6}, {x:10, y:22}, {x:-10, y:22}, {x:-15, y:6}],
            // Frigate (Radius ~28)
            [{x:0, y:-26}, {x:16, y:8}, {x:12, y:26}, {x:-12, y:26}, {x:-16, y:8}],
            // Galleon (Radius ~32)
            [{x:0, y:-30}, {x:18, y:10}, {x:14, y:30}, {x:-14, y:30}, {x:-18, y:10}]
        ];

        // 1. Initialize Game
        function initGame() {
            playerShips = generateShips(true);
            aiShips = generateShips(false);
            playerShots = [];
            aiShots = [];
            pendingShot = null;
            isPlayerTurn = true;
            isAnimating = false;

            fireBtn.disabled = true;
            turnBadge.innerText = "Your Turn!";
            turnBadge.style.background = "var(--teal)";

            updateScores();
            draw();
        }

        // 2. Random Ship Distribution Generator
        function generateShips(isLeft) {
            const ships = [];
            const minX = isLeft ? 40 : MID_X + 40;
            const maxX = isLeft ? MID_X - 40 : WIDTH - 40;
            const minY = 50;
            const maxY = HEIGHT - 50;

            shipTemplates.forEach((template, index) => {
                let placed = false;
                let attempts = 0;

                while (!placed && attempts < 100) {
                    attempts++;
                    const x = Math.random() * (maxX - minX) + minX;
                    const y = Math.random() * (maxY - minY) + minY;
                    const angle = Math.random() * Math.PI * 2;

                    // Check for overlap with existing ships
                    let overlap = false;
                    for (let s of ships) {
                        const dist = Math.hypot(s.x - x, s.y - y);
                        if (dist < 60) { overlap = true; break; }
                    }

                    if (!overlap) {
                        ships.push({
                            id: index,
                            x: x,
                            y: y,
                            angle: angle,
                            template: template,
                            sunk: false
                        });
                        placed = true;
                    }
                }
            });
            return ships;
        }

        // 3. Polygon / Point Collision (Is cannonball inside or touching ship outline?)
        function isPointInShip(px, py, ship) {
            // Transform point into ship's local coordinates
            const dx = px - ship.x;
            const dy = py - ship.y;
            const localX = dx * Math.cos(-ship.angle) - dy * Math.sin(-ship.angle);
            const localY = dx * Math.sin(-ship.angle) + dy * Math.cos(-ship.angle);

            // Raycasting algorithm for polygon inclusion
            const poly = ship.template;
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const xi = poly[i].x, yi = poly[i].y;
                const xj = poly[j].x, yj = poly[j].y;

                const intersect = ((yi > localY) !== (yj > localY)) &&
                    (localX < (xj - xi) * (localY - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }

            // Also check proximity for close hits (pencil mark touch)
            if (!inside) {
                const dist = Math.hypot(localX, localY);
                if (dist < 12) return true;
            }

            return inside;
        }

        // 4. Handle Canvas Click (Placing Cannonball Mark)
        canvas.addEventListener('pointerdown', (e) => {
            if (!isPlayerTurn || isAnimating) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (WIDTH / rect.width);
            const clickY = (e.clientY - rect.top) * (HEIGHT / rect.height);

            // Player can only mark on their side (Left: x < MID_X)
            if (clickX >= 20 && clickX <= MID_X - 15 && clickY >= 20 && clickY <= HEIGHT - 20) {
                pendingShot = { x: clickX, y: clickY };
                fireBtn.disabled = false;
                draw();
            }
        });

        // 5. Fire Cannonball (Fold paper animation & reflection check)
        fireBtn.addEventListener('click', () => {
            if (!pendingShot || !isPlayerTurn || isAnimating) return;

            isAnimating = true;
            fireBtn.disabled = true;

            // Reflect across the middle vertical fold line
            // Formula: x_reflected = MID_X + (MID_X - x_original)
            const reflectedX = MID_X + (MID_X - pendingShot.x);
            const shotY = pendingShot.y;

            // Check if shot hits any AI ship
            let hit = false;
            for (let ship of aiShips) {
                if (!ship.sunk && isPointInShip(reflectedX, shotY, ship)) {
                    ship.sunk = true;
                    hit = true;
                    break;
                }
            }

            playerShots.push({
                x: pendingShot.x,
                y: shotY,
                reflectedX: reflectedX,
                hit: hit
            });

            pendingShot = null;

            // Trigger Fold Animation
            animatePaperFold(true, () => {
                updateScores();
                checkWinCondition();

                if (isPlayerTurn) {
                    // Switch to AI Turn
                    isPlayerTurn = false;
                    turnBadge.innerText = "Winnie's Turn...";
                    turnBadge.style.background = "var(--coral)";
                    setTimeout(triggerAITurn, 1200);
                }
            });
        });

        // 6. AI Turn (Winnie Firing)
        function triggerAITurn() {
            // AI picks a spot on her side (Right: x > MID_X)
            // AI strategy: 60% smart reflection guess near unsunk player ships, 40% random
            let shotX, shotY;
            const unsunkPlayerShips = playerShips.filter(s => !s.sunk);

            if (unsunkPlayerShips.length > 0 && Math.random() < 0.6) {
                // Aim near a target ship's reflected location
                const targetShip = unsunkPlayerShips[Math.floor(Math.random() * unsunkPlayerShips.length)];
                const targetReflectedX = MID_X + (MID_X - targetShip.x);
                const offset = (Math.random() - 0.5) * 40;
                
                shotX = Math.min(WIDTH - 20, Math.max(MID_X + 20, targetReflectedX + offset));
                shotY = Math.min(HEIGHT - 20, Math.max(20, targetShip.y + (Math.random() - 0.5) * 40));
            } else {
                // Random shot
                shotX = Math.random() * (WIDTH - MID_X - 40) + MID_X + 20;
                shotY = Math.random() * (HEIGHT - 40) + 20;
            }

            // Reflect AI shot onto Player's side (Left)
            const reflectedX = MID_X - (shotX - MID_X);

            let hit = false;
            for (let ship of playerShips) {
                if (!ship.sunk && isPointInShip(reflectedX, shotY, ship)) {
                    ship.sunk = true;
                    hit = true;
                    break;
                }
            }

            aiShots.push({
                x: shotX,
                y: shotY,
                reflectedX: reflectedX,
                hit: hit
            });

            // Trigger Fold Animation (Right side folds onto Left side)
            animatePaperFold(false, () => {
                updateScores();
                checkWinCondition();

                isPlayerTurn = true;
                isAnimating = false;
                turnBadge.innerText = "Your Turn!";
                turnBadge.style.background = "var(--teal)";
                draw();
            });
        }

        // 7. Visual Paper Fold Animation
        function animatePaperFold(isLeftToRight, callback) {
            foldOverlay.style.display = 'block';
            foldOverlay.style.left = isLeftToRight ? '0px' : `${MID_X}px`;
            foldOverlay.style.transformOrigin = isLeftToRight ? 'right center' : 'left center';

            let progress = 0;
            const duration = 600; // ms
            const startTime = performance.now();

            function step(timestamp) {
                const elapsed = timestamp - startTime;
                progress = Math.min(1, elapsed / duration);

                // Smooth cosine fold curve
                const angle = progress * 180;
                foldOverlay.style.transform = `rotateY(${isLeftToRight ? -angle : angle}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    foldOverlay.style.display = 'none';
                    draw();
                    if (callback) callback();
                }
            }
            requestAnimationFrame(step);
        }

        // 8. Draw Canvas Graphics
        function draw() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // Draw Player Ships (Navy Ink)
            playerShips.forEach(ship => drawShip(ship, '#2D3142', '#A78BFA'));

            // Draw AI Ships (Coral Ink)
            aiShips.forEach(ship => drawShip(ship, '#E14E56', '#FF6B6B'));

            // Draw Player Shots
            playerShots.forEach(s => {
                // Original mark
                drawPencilMark(s.x, s.y, '#2D3142');
                // Reflected mark on Winnie's side
                drawPencilMark(s.reflectedX, s.y, '#2D3142');
                if (s.hit) drawSunkX(s.reflectedX, s.y);
            });

            // Draw AI Shots
            aiShots.forEach(s => {
                // Original mark on Winnie's side
                drawPencilMark(s.x, s.y, '#E14E56');
                // Reflected mark on Player's side
                drawPencilMark(s.reflectedX, s.y, '#E14E56');
                if (s.hit) drawSunkX(s.reflectedX, s.y);
            });

            // Draw Pending Player Shot
            if (pendingShot) {
                drawPencilMark(pendingShot.x, pendingShot.y, '#2FA79E', true);
                
                // Draw faint reflection preview guide line to teach symmetry!
                ctx.beginPath();
                ctx.moveTo(pendingShot.x, pendingShot.y);
                ctx.lineTo(MID_X + (MID_X - pendingShot.x), pendingShot.y);
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = 'rgba(78, 205, 196, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawShip(ship, strokeColor, fillColor) {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);

            ctx.beginPath();
            const t = ship.template;
            ctx.moveTo(t[0].x, t[0].y);
            for (let i = 1; i < t.length; i++) {
                ctx.lineTo(t[i].x, t[i].y);
            }
            ctx.closePath();

            ctx.fillStyle = ship.sunk ? 'rgba(225, 78, 86, 0.2)' : 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.restore();
        }

        function drawPencilMark(x, y, color, isPulse = false) {
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            if (isPulse) {
                ctx.beginPath();
                ctx.arc(x, y, 9, 0, Math.PI * 2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawSunkX(x, y) {
            ctx.beginPath();
            ctx.moveTo(x - 12, y - 12); ctx.lineTo(x + 12, y + 12);
            ctx.moveTo(x + 12, y - 12); ctx.lineTo(x - 12, y + 12);
            ctx.strokeStyle = '#E14E56';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // 9. Score and Win Conditions
        function updateScores() {
            const playerSunk = aiShips.filter(s => s.sunk).length;
            const aiSunk = playerShips.filter(s => s.sunk).length;

            playerScoreEl.innerText = `${playerSunk}/5 Sunk`;
            aiScoreEl.innerText = `${aiSunk}/5 Sunk`;
        }

        function checkWinCondition() {
            const playerSunk = aiShips.filter(s => s.sunk).length;
            const aiSunk = playerShips.filter(s => s.sunk).length;

            if (playerSunk === 5) {
                showModal("🎉 Victory!", "Grogg sunk all of Winnie's ships! You mastered reflective symmetry!");
            } else if (aiSunk === 5) {
                showModal("🏴‍☠️ Game Over!", "Winnie sunk all your ships this time. Hit Generate New Board to try again!");
            }
        }

        function showModal(title, desc) {
            modalTitle.innerText = title;
            modalDesc.innerHTML = desc;
            modal.classList.add('active');
        }

        modalCloseBtn.addEventListener('click', () => modal.classList.remove('active'));
        rulesBtn.addEventListener('click', () => {
            showModal("How to Play Carronade", "1. Click on <strong>Grogg's Side (Left)</strong> to mark a cannonball shot.<br>2. Click <strong>Fold & Fire</strong> to fold the paper and reflect your mark onto Winnie's side!<br>3. First player to sink all 5 ships wins!");
        });

        newBoardBtn.addEventListener('click', initGame);

        // Start initial game
        initGame();
    </script>
</body>
</html>
