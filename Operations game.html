<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations Challenge | Math Adventure Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%9E%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral: #FF6B6B;   --coral-deep: #E14E56;
            --teal: #4ECDC4;    --teal-deep: #2FA79E;
            --purple: #A78BFA;  --purple-deep: #7C5CE0;
            --green: #6BCB77;   --green-deep: #48A857;
            --yellow: #FFD93D;
            --ink: #2D3142;
            --muted: #667085;
            --bg-top: #EAF6FF;
            --bg-bottom: #F5F0FF;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Quicksand', system-ui, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--ink);
            margin: 0; padding: 0;
            line-height: 1.6; min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
        }

        body::before, body::after {
            content: ""; position: fixed; width: 480px; height: 480px; border-radius: 50%;
            filter: blur(70px); opacity: .25; z-index: -1;
        }
        body::before { background: var(--teal); top: -100px; left: -150px; }
        body::after { background: var(--yellow); bottom: -100px; right: -150px; }

        header {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            padding: 12px 30px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 15px rgba(45, 49, 66, 0.05); position: sticky; top: 0; z-index: 100;
        }

        .back-btn {
            text-decoration: none; color: var(--ink); font-family: 'Baloo 2', sans-serif;
            font-weight: 700; display: flex; align-items: center; gap: 8px;
            background: white; padding: 8px 20px; border-radius: 999px;
            box-shadow: 0 4px 0 rgba(45, 49, 66, 0.1); transition: transform 0.15s, box-shadow 0.15s;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(45, 49, 66, 0.1); }
        .back-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(45, 49, 66, 0.1); }

        header h1 { font-family: 'Baloo 2', sans-serif; margin: 0; font-size: 1.6rem; color: var(--purple-deep); text-align: center; }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; max-width: 800px; margin: 0 auto; width: 100%; }

        .dashboard {
            background: white; padding: 15px 30px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; flex-direction: column;
            gap: 15px; margin-bottom: 40px; width: 100%; max-width: 600px;
        }

        .stats-row { display: flex; gap: 20px; width: 100%; justify-content: center; align-items: center; flex-wrap: wrap; }
        .streak-badge { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1.2rem; color: var(--coral-deep); }
        .target-badge { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.4rem; padding: 6px 24px; border-radius: 999px; background: var(--teal); color: white; box-shadow: 0 4px 0 var(--teal-deep); }

        /* Mode Toggle */
        .toggle-group { display: flex; background: var(--bg-top); border-radius: 999px; overflow: hidden; border: 2px solid var(--purple); }
        .toggle-btn { background: transparent; border: none; padding: 8px 16px; font-family: 'Baloo 2', sans-serif; font-weight: 700; color: var(--ink); cursor: pointer; transition: background 0.2s, color 0.2s; }
        .toggle-btn.active { background: var(--purple); color: white; }

        /* ---------- NORMAL MODE UI ---------- */
        #normal-mode-container { display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%; }
        .cards-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; min-height: 140px; }

        .number-card {
            background: var(--card-bg); width: 100px; height: 130px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 3rem; color: var(--ink);
            box-shadow: 0 8px 0 #E2E8F0, 0 15px 20px rgba(0,0,0,0.05);
            cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none; border: 4px solid transparent;
        }
        .number-card:hover { transform: translateY(-6px); box-shadow: 0 14px 0 #E2E8F0, 0 20px 25px rgba(0,0,0,0.08); }
        .number-card:active { transform: translateY(4px); box-shadow: 0 4px 0 #E2E8F0, 0 5px 10px rgba(0,0,0,0.05); }
        .number-card.selected { border-color: var(--coral); color: var(--coral-deep); transform: translateY(-10px); box-shadow: 0 18px 0 #E2E8F0, 0 20px 30px rgba(225, 78, 86, 0.2); }

        .operators { display: flex; gap: 15px; background: white; padding: 15px 25px; border-radius: 999px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .op-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--bg-top); color: var(--teal-deep);
            font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 0 var(--teal); transition: all 0.2s ease;
        }
        .op-btn:hover { transform: translateY(-3px); box-shadow: 0 7px 0 var(--teal); background: #D9F1FF; }
        .op-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--teal); }
        .op-btn.selected { background: var(--teal); color: white; transform: translateY(2px); box-shadow: 0 2px 0 var(--teal-deep); }

        /* ---------- HARD MODE UI ---------- */
        #hard-mode-container { display: none; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        
        .equation-builder {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 8px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            max-width: 100%;
        }

        .hm-num {
            background: var(--card-bg); width: 60px; height: 80px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 2rem; color: var(--ink);
            box-shadow: 0 4px 0 #E2E8F0; user-select: none;
        }

        .bracket-slot {
            width: 32px; height: 55px; border: 2px dashed #CBD5E1; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1.8rem;
            color: var(--teal-deep); cursor: pointer; transition: all 0.2s ease;
        }
        .bracket-slot.filled { border-style: solid; border-color: var(--teal); background: var(--bg-top); }
        .bracket-slot:active { transform: scale(0.9); }

        .hm-op-slot {
            width: 45px; height: 45px; border: 2px dashed #CBD5E1; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1.8rem;
            color: var(--purple-deep); cursor: pointer; transition: all 0.2s ease;
        }
        .hm-op-slot.filled { border-style: solid; border-color: var(--purple); background: #F5F0FF; }
        .hm-op-slot:active { transform: scale(0.9); }

        /* The new Equals 24 text */
        .hm-equals {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            color: var(--ink);
            padding-left: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------- CONTROLS ---------- */
        .controls { margin-top: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .game-btn {
            background: white; border: none; color: var(--ink); font-family: 'Baloo 2', sans-serif;
            font-weight: 700; font-size: 1.1rem; padding: 12px 28px; border-radius: 999px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(45, 49, 66, 0.1); transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .game-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(45, 49, 66, 0.1); }
        .game-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(45, 49, 66, 0.1); }
        .game-btn.primary { background: var(--purple); color: white; box-shadow: 0 4px 0 var(--purple-deep); }
        .game-btn.secondary { background: var(--yellow); color: var(--ink); box-shadow: 0 4px 0 #E5C337; }
        .game-btn.success { background: var(--green); color: white; box-shadow: 0 4px 0 var(--green-deep); }

        /* ---------- CUSTOM MODAL ---------- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(45, 49, 66, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: white; border-radius: 30px; padding: 35px 30px; max-width: 450px; width: 90%; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-card h2 { font-family: 'Baloo 2', sans-serif; font-size: 2.2rem; margin: 0 0 10px; }
        .modal-card p { color: var(--muted); font-size: 1.1rem; margin-bottom: 25px; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.3rem; }
            .number-card { width: 75px; height: 100px; font-size: 2.2rem; }
            .op-btn { width: 50px; height: 50px; font-size: 1.8rem; }
            .equation-builder { gap: 4px; padding: 15px 10px; }
            .hm-num { width: 45px; height: 60px; font-size: 1.5rem; }
            .bracket-slot { width: 20px; height: 45px; font-size: 1.4rem; border-width: 1px; }
            .hm-op-slot { width: 35px; height: 35px; font-size: 1.4rem; border-width: 1px; }
            .hm-equals { font-size: 1.8rem; padding-left: 4px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Hub
        </a>
        <h1>Operations Challenge</h1>
        <div style="width: 80px;"></div>
    </header>

    <main>
        <div class="dashboard">
            <div class="toggle-group" id="mode-group">
                <button class="toggle-btn active" data-mode="normal">Normal Mode</button>
                <button class="toggle-btn" data-mode="hard">Hard Mode</button>
            </div>
            <div class="stats-row">
                <div class="streak-badge">🔥 Streak: <span id="streak-count">0</span></div>
                <div class="target-badge">🎯 Target: <span id="target-value">10</span></div>
            </div>
        </div>

        <!-- Normal Mode -->
        <div id="normal-mode-container">
            <div class="cards-container" id="cards-container"></div>
            <div class="operators">
                <button class="op-btn" data-op="+">+</button>
                <button class="op-btn" data-op="-">−</button>
                <button class="op-btn" data-op="*">×</button>
                <button class="op-btn" data-op="/">÷</button>
            </div>
        </div>

        <!-- Hard Mode -->
        <div id="hard-mode-container">
            <div class="equation-builder">
                <!-- Programmatically generated equation slots -->
            </div>
            <button class="game-btn success" id="btn-check-hard">✔️ Check Math</button>
        </div>

        <div class="controls">
            <button class="game-btn secondary" id="btn-reset">↩️ Undo / Reset</button>
            <button class="game-btn primary" id="btn-skip">⏭️ Skip Puzzle</button>
            <button class="game-btn" id="btn-impossible">🚫 Not Possible</button>
            <button class="game-btn" id="btn-rules">❓ How to Play</button>
        </div>
    </main>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-card">
            <h2 id="modal-title">Title</h2>
            <p id="modal-desc" style="word-wrap: break-word;"></p>
            <button class="game-btn primary" style="margin: 0 auto;" id="modal-close-btn">Continue</button>
        </div>
    </div>

    <script>
        // --- PUZZLE DATA ---
        // Normal puzzles are designed for a quick answer (about 10 seconds).
        const normalPuzzleBank = [
            { numbers: [1, 2, 3, 4], target: 10 },
            { numbers: [1, 2, 3, 6], target: 15 },
            { numbers: [2, 3, 4, 5], target: 10 },
            { numbers: [1, 3, 4, 4], target: 16 },
            { numbers: [2, 2, 3, 8], target: 15 },
            { numbers: [1, 2, 5, 8], target: 20 },
            { numbers: [2, 3, 5, 6], target: 24 },
            { numbers: [2, 4, 5, 8], target: 18 },
            { numbers: [1, 3, 6, 9], target: 18 },
            { numbers: [3, 4, 5, 7], target: 14 },
            { numbers: [2, 4, 4, 8], target: 12 },
            { numbers: [1, 2, 7, 9], target: 20 }
        ];

        // Hard puzzles keep number order fixed and require exactly one bracket
        // pair. They are intended to take no more than about 30–60 seconds.
        const hardPuzzleBank = [
            { numbers: [6, 8, 4, 2], target: 22 },
            { numbers: [8, 4, 6, 3], target: 24 },
            { numbers: [9, 3, 4, 2], target: 14 },
            { numbers: [6, 2, 5, 3], target: 17 },
            { numbers: [4, 2, 7, 3], target: 39 },
            { numbers: [8, 4, 3, 2], target: 8 },
            { numbers: [7, 1, 4, 2], target: 12 },
            { numbers: [5, 3, 6, 2], target: 24 }
        ];

        // A sample answer is kept for each locked-order hard puzzle.
        // Every division shown here has a whole-number result.
        const hardPuzzleSolutions = {
            '22|6,8,4,2': '6 + 8 × (4 − 2) = 22',
            '24|8,4,6,3': '(8 + 4) × 6 ÷ 3 = 24',
            '14|9,3,4,2': '(9 ÷ 3 + 4) × 2 = 14',
            '17|6,2,5,3': '(6 − 2) × 5 − 3 = 17',
            '39|4,2,7,3': '(4 + 2) × 7 − 3 = 39',
            '8|8,4,3,2': '(8 + 4) ÷ 3 × 2 = 8',
            '12|7,1,4,2': '(7 − 1) × 4 ÷ 2 = 12',
            '24|5,3,6,2': '(5 + 3) × 6 ÷ 2 = 24'
        };

        // Finds a normal-mode solution using exactly the same rules as the game:
        // subtraction stays non-negative and every division result is a whole number.
        function findWholeNumberSolution(numbers, target) {
            const search = (items) => {
                if (items.length === 1) return items[0].value === target ? items[0].expr : null;

                for (let i = 0; i < items.length; i++) {
                    for (let j = i + 1; j < items.length; j++) {
                        const a = items[i], b = items[j];
                        const rest = items.filter((_, index) => index !== i && index !== j);
                        const bigger = a.value >= b.value ? a : b;
                        const smaller = a.value >= b.value ? b : a;
                        const candidates = [
                            { value: a.value + b.value, expr: `(${a.expr} + ${b.expr})` },
                            { value: a.value * b.value, expr: `(${a.expr} × ${b.expr})` },
                            { value: bigger.value - smaller.value, expr: `(${bigger.expr} − ${smaller.expr})` }
                        ];

                        if (b.value !== 0 && a.value % b.value === 0) {
                            candidates.push({ value: a.value / b.value, expr: `(${a.expr} ÷ ${b.expr})` });
                        }
                        if (a.value !== 0 && b.value % a.value === 0) {
                            candidates.push({ value: b.value / a.value, expr: `(${b.expr} ÷ ${a.expr})` });
                        }

                        for (const candidate of candidates) {
                            const answer = search([...rest, candidate]);
                            if (answer) return answer;
                        }
                    }
                }
                return null;
            };

            return search(numbers.map(value => ({ value, expr: String(value) })));
        }

        // Evaluates hard-mode expressions while rejecting division that creates
        // a fraction at any intermediate step.
        function evaluateWholeNumberExpression(expression) {
            let position = 0;

            const skipSpaces = () => {
                while (expression[position] === ' ') position++;
            };
            const parseNumber = () => {
                skipSpaces();
                let digits = '';
                while (/\d/.test(expression[position] || '')) digits += expression[position++];
                if (!digits) throw new Error('Expected a number');
                return Number(digits);
            };
            const parseFactor = () => {
                skipSpaces();
                if (expression[position] === '(') {
                    position++;
                    const value = parseAddSubtract();
                    skipSpaces();
                    if (expression[position] !== ')') throw new Error('Missing closing bracket');
                    position++;
                    return value;
                }
                return parseNumber();
            };
            const parseMultiplyDivide = () => {
                let value = parseFactor();
                while (true) {
                    skipSpaces();
                    const operator = expression[position];
                    if (operator !== '*' && operator !== '/') break;
                    position++;
                    const right = parseFactor();
                    if (operator === '*') {
                        value *= right;
                    } else {
                        if (right === 0 || !Number.isInteger(value) || !Number.isInteger(right) || value % right !== 0) {
                            const error = new Error('Division must give a whole number');
                            error.code = 'NON_WHOLE_DIVISION';
                            throw error;
                        }
                        value /= right;
                    }
                }
                return value;
            };
            const parseAddSubtract = () => {
                let value = parseMultiplyDivide();
                while (true) {
                    skipSpaces();
                    const operator = expression[position];
                    if (operator !== '+' && operator !== '-') break;
                    position++;
                    const right = parseMultiplyDivide();
                    value = operator === '+' ? value + right : value - right;
                }
                return value;
            };

            const result = parseAddSubtract();
            skipSpaces();
            if (position !== expression.length) throw new Error('Unexpected symbol');
            return result;
        }

        // --- GAME STATE ---
        let currentMode = 'normal';
        let currentPuzzle = { numbers: [], target: 10 }; 
        let currentCards = [];  
        let selectedCardIndex = null;
        let selectedOperator = null;
        let streak = 0;

        // --- DOM ELEMENTS ---
        const modeBtns = document.querySelectorAll('.toggle-btn');
        const normalContainer = document.getElementById('normal-mode-container');
        const hardContainer = document.getElementById('hard-mode-container');
        const cardsContainer = document.getElementById('cards-container');
        const eqBuilder = document.querySelector('.equation-builder');
        const opBtns = document.querySelectorAll('.op-btn');
        const streakEl = document.getElementById('streak-count');
        const targetEl = document.getElementById('target-value');
        
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // --- INITIALIZATION ---
        modeBtns.forEach(btn => btn.addEventListener('click', (e) => {
            modeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentMode = e.target.dataset.mode;
            
            if (currentMode === 'normal') {
                normalContainer.style.display = 'flex';
                hardContainer.style.display = 'none';
            } else {
                normalContainer.style.display = 'none';
                hardContainer.style.display = 'flex';
            }
            
            streak = 0; streakEl.innerText = streak;
            loadNewPuzzle();
        }));

        function loadNewPuzzle() {
            const bank = currentMode === 'normal'
                ? normalPuzzleBank.filter(puzzle => findWholeNumberSolution(puzzle.numbers, puzzle.target))
                : hardPuzzleBank.filter(puzzle => hardPuzzleSolutions[puzzle.target + '|' + puzzle.numbers.join(',')]);
            const randomIndex = Math.floor(Math.random() * bank.length);
            const selectedPuzzle = bank[randomIndex];
            currentPuzzle = { numbers: [...selectedPuzzle.numbers], target: selectedPuzzle.target };
            targetEl.innerText = currentPuzzle.target;
            
            if (currentMode === 'normal') {
                currentPuzzle.numbers.sort(() => Math.random() - 0.5); // Shuffle for normal mode
                resetNormalPuzzle();
            } else {
                buildHardModeUI();
            }
        }

        // --- NORMAL MODE LOGIC ---
        function resetNormalPuzzle() {
            currentCards = [...currentPuzzle.numbers];
            clearSelections();
            renderCards();
        }

        function renderCards() {
            cardsContainer.innerHTML = '';
            currentCards.forEach((num, index) => {
                const card = document.createElement('div');
                card.classList.add('number-card');
                if (index === selectedCardIndex) card.classList.add('selected');
                card.innerText = num;
                card.addEventListener('click', () => handleCardClick(index));
                cardsContainer.appendChild(card);
            });
            checkNormalWin();
        }

        function clearSelections() {
            selectedCardIndex = null;
            selectedOperator = null;
            opBtns.forEach(btn => btn.classList.remove('selected'));
        }

        function handleCardClick(index) {
            if (selectedCardIndex === null) {
                selectedCardIndex = index;
                renderCards();
            } else if (selectedCardIndex !== null && selectedOperator !== null && selectedCardIndex !== index) {
                executeMath(selectedCardIndex, index);
            } else {
                selectedCardIndex = index;
                renderCards();
            }
        }

        opBtns.forEach(btn => btn.addEventListener('click', (e) => {
            if (selectedCardIndex !== null) {
                opBtns.forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedOperator = e.target.dataset.op;
            } else { showToast("Select a number card first!"); }
        }));

        function executeMath(index1, index2) {
            const num1 = currentCards[index1];
            const num2 = currentCards[index2];
            let result = 0;

            switch (selectedOperator) {
                case '+': result = num1 + num2; break;
                case '-': result = Math.abs(num1 - num2); break;
                case '*': result = num1 * num2; break;
                case '/': 
                    if (num1 % num2 === 0) result = num1 / num2;
                    else if (num2 % num1 === 0) result = num2 / num1;
                    else {
                        showModal("Math Error!", "Division must result in a whole number. Try a different move!", false);
                        clearSelections(); renderCards(); return;
                    }
                    break;
            }

            const indices = [index1, index2].sort((a, b) => b - a);
            currentCards.splice(indices[0], 1);
            currentCards.splice(indices[1], 1);
            currentCards.push(result);

            clearSelections(); renderCards();
        }

        function checkNormalWin() {
            if (currentCards.length === 1) {
                if (currentCards[0] === currentPuzzle.target) {
                    streak++; streakEl.innerText = streak;
                    showModal(`🎉 Target ${currentPuzzle.target} Reached!`, "Brilliant math skills! You combined all the numbers perfectly.", true);
                } else {
                    streak = 0; streakEl.innerText = streak;
                    showModal(`Not quite ${currentPuzzle.target}!`, `You ended up with ${currentCards[0]}. Let's try that puzzle again.`, false);
                    resetNormalPuzzle();
                }
            }
        }

        // --- HARD MODE LOGIC ---
        const bracketStates = ['', '(', ')'];
        const opStates = ['', '+', '−', '×', '÷'];

        function buildHardModeUI() {
            eqBuilder.innerHTML = '';
            for(let i = 0; i < 4; i++) {
                // Pre-number bracket
                eqBuilder.appendChild(createBracketSlot(i * 2));
                // Number
                const numEl = document.createElement('div');
                numEl.className = 'hm-num';
                numEl.innerText = currentPuzzle.numbers[i];
                eqBuilder.appendChild(numEl);
                // Post-number bracket
                eqBuilder.appendChild(createBracketSlot(i * 2 + 1));
                
                // Operator slot (except after last number)
                if (i < 3) {
                    const opEl = document.createElement('div');
                    opEl.className = 'hm-op-slot';
                    opEl.dataset.index = i;
                    opEl.addEventListener('click', function() {
                        let idx = (opStates.indexOf(this.innerText) + 1) % opStates.length;
                        this.innerText = opStates[idx];
                        this.classList.toggle('filled', opStates[idx] !== '');
                    });
                    eqBuilder.appendChild(opEl);
                }
            }
            
            // Equals-target static element
            const equalsEl = document.createElement('div');
            equalsEl.className = 'hm-equals';
            equalsEl.innerText = '= ' + currentPuzzle.target;
            eqBuilder.appendChild(equalsEl);
        }

        function createBracketSlot(index) {
            const el = document.createElement('div');
            el.className = 'bracket-slot';
            el.dataset.index = index;
            el.addEventListener('click', function() {
                let idx = (bracketStates.indexOf(this.innerText) + 1) % bracketStates.length;
                this.innerText = bracketStates[idx];
                this.classList.toggle('filled', bracketStates[idx] !== '');
            });
            return el;
        }

        document.getElementById('btn-check-hard').addEventListener('click', () => {
            let exprToEval = '';
            let displayExpr = '';

            for(let i=0; i<4; i++) {
                let b1 = document.querySelector(`.bracket-slot[data-index="${i*2}"]`).innerText;
                let b2 = document.querySelector(`.bracket-slot[data-index="${i*2+1}"]`).innerText;
                
                exprToEval += b1 + currentPuzzle.numbers[i] + b2;
                displayExpr += b1 + currentPuzzle.numbers[i] + b2;

                if (i < 3) {
                    let opUI = document.querySelector(`.hm-op-slot[data-index="${i}"]`).innerText;
                    if (!opUI) { showModal("Incomplete!", "Please tap the circles to select all 3 math operations.", false); return; }
                    displayExpr += ` ${opUI} `;
                    if (opUI === '−') opUI = '-';
                    if (opUI === '×') opUI = '*';
                    if (opUI === '÷') opUI = '/';
                    exprToEval += opUI;
                }
            }

            // Bracket Validation
            let openCount = (exprToEval.match(/\(/g) || []).length;
            let closeCount = (exprToEval.match(/\)/g) || []).length;

            if (openCount !== 1 || closeCount !== 1) {
                showModal("Bracket Error!", "Hard mode requires you to place exactly ONE pair of brackets: one '(' and one ')'.", false); return;
            }
            if (exprToEval.indexOf(')') < exprToEval.indexOf('(')) {
                showModal("Bracket Error!", "The closing bracket ')' cannot come before the opening bracket '('.", false); return;
            }
            if (exprToEval.includes('()')) {
                showModal("Bracket Error!", "Brackets cannot be empty.", false); return;
            }

            // Evaluation
            try {
                let result = evaluateWholeNumberExpression(exprToEval);
                
                if (result === currentPuzzle.target) {
                    streak++; streakEl.innerText = streak;
                    showModal(`🎉 Target ${currentPuzzle.target} Reached!`, `Correct! <br><strong>${displayExpr} = ${currentPuzzle.target}</strong>`, true);
                } else {
                    streak = 0; streakEl.innerText = streak;
                    showModal(`Not quite ${currentPuzzle.target}!`, `Your equation equals ${result}.<br><br><small>${displayExpr} = ${result}</small>`, false);
                }
            } catch(e) {
                if (e.code === 'NON_WHOLE_DIVISION') {
                    showModal("Whole Numbers Only!", "Each division step must give a whole number. Try a different operation or move your brackets.", false);
                } else {
                    showModal("Math Error!", "That equation doesn't make sense. Check where you placed your brackets!", false);
                }
            }
        });

        // --- SHARED LOGIC ---
        function showModal(title, desc, isWin) {
            modalTitle.innerText = title; modalDesc.innerHTML = desc;
            if (isWin) {
                modalCloseBtn.innerText = "Next Puzzle";
                modalCloseBtn.onclick = () => { modal.classList.remove('active'); loadNewPuzzle(); };
            } else {
                modalCloseBtn.innerText = "Try Again";
                modalCloseBtn.onclick = () => { modal.classList.remove('active'); };
            }
            modal.classList.add('active');
        }

        function showToast(msg) {
            const toast = document.createElement('div'); toast.innerText = msg;
            toast.style.position = 'fixed'; toast.style.bottom = '30px'; toast.style.left = '50%'; toast.style.transform = 'translateX(-50%)';
            toast.style.background = 'var(--ink)'; toast.style.color = 'white'; toast.style.padding = '10px 20px'; toast.style.borderRadius = '999px';
            toast.style.fontFamily = "'Quicksand', sans-serif"; toast.style.fontWeight = '600'; toast.style.boxShadow = '0 10px 20px rgba(0,0,0,0.1)'; toast.style.zIndex = '300';
            document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500);
        }

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (currentMode === 'normal') resetNormalPuzzle();
            else buildHardModeUI();
        });
        
        document.getElementById('btn-skip').addEventListener('click', () => { streak = 0; streakEl.innerText = streak; loadNewPuzzle(); });

        document.getElementById('btn-impossible').addEventListener('click', () => {
            const solution = currentMode === 'normal'
                ? findWholeNumberSolution(currentPuzzle.numbers, currentPuzzle.target)
                : hardPuzzleSolutions[currentPuzzle.target + '|' + currentPuzzle.numbers.join(',')];

            if (solution) {
                streak = 0; streakEl.innerText = streak;
                showModal(
                    "This one is possible!",
                    `Here is one sample answer using whole-number division:<br><br><strong>${solution}${currentMode === 'normal' ? ' = ' + currentPuzzle.target : ''}</strong>`,
                    false
                );
            } else {
                showModal("You spotted it!", "This puzzle has no solution under the whole-number division rule. We’ll replace it with a new one.", true);
            }
        });

        document.getElementById('btn-rules').addEventListener('click', () => {
            modalTitle.innerText = "How to Play";
            if(currentMode === 'normal') {
                modalDesc.innerHTML = "1. Click a number.<br>2. Choose an operator (+, -, ×, ÷).<br>3. Click another number.<br><br>Keep combining numbers until you only have <strong>one card left</strong>, and it equals the displayed <strong>target number</strong>!";
            } else {
                modalDesc.innerHTML = "The numbers are locked in place!<br><br>1. Tap the dashed circles to cycle through operations (+, -, ×, ÷).<br>2. Tap the dashed tall boxes to place exactly <strong>one</strong> pair of brackets `( )`.<br>3. Hit <strong>Check Math</strong> to see if it equals the displayed target!";
            }
            modalCloseBtn.innerText = "Got it!";
            modalCloseBtn.onclick = () => modal.classList.remove('active');
            modal.classList.add('active');
        });

        // Boot
        loadNewPuzzle();
    </script>
</body>
</html>
