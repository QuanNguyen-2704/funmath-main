<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gomoku | Math Adventure Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%9E%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral: #FF6B6B;   --coral-deep: #E14E56;
            --teal: #4ECDC4;    --teal-deep: #2FA79E;
            --purple: #A78BFA;  --purple-deep: #7C5CE0;
            --green: #6BCB77;   --green-deep: #48A857;
            --yellow: #FFD93D;
            --ink: #2D3142;
            --muted: #667085;
            --bg-top: #EAF6FF;
            --bg-bottom: #F5F0FF;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Quicksand', system-ui, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--ink);
            margin: 0; padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
        }

        /* Ambient Blobs */
        body::before, body::after {
            content: ""; position: fixed; width: 480px; height: 480px; border-radius: 50%;
            filter: blur(70px); opacity: .25; z-index: -1;
        }
        body::before { background: var(--teal); top: -100px; left: -150px; }
        body::after { background: var(--purple); bottom: -100px; right: -150px; }

        /* ---------- HEADER ---------- */
        header {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            padding: 12px 30px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 15px rgba(45, 49, 66, 0.05); position: sticky; top: 0; z-index: 100;
        }

        .back-btn {
            text-decoration: none; color: var(--ink); font-family: 'Baloo 2', sans-serif;
            font-weight: 700; display: flex; align-items: center; gap: 8px;
            background: white; padding: 8px 20px; border-radius: 999px;
            box-shadow: 0 4px 0 rgba(45, 49, 66, 0.1); transition: transform 0.15s, box-shadow 0.15s;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(45, 49, 66, 0.1); }
        .back-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(45, 49, 66, 0.1); }

        header h1 { font-family: 'Baloo 2', sans-serif; margin: 0; font-size: 1.6rem; color: var(--teal-deep); text-align: center; }

        /* ---------- UI SCREENS ---------- */
        .screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .screen.active { display: flex; }

        .menu-card {
            background: var(--card-bg); border-radius: 30px; padding: 40px; max-width: 500px; width: 100%;
            text-align: center; box-shadow: 0 15px 35px rgba(45, 49, 66, 0.1);
        }
        .menu-card h2 { font-family: 'Baloo 2', sans-serif; font-size: 2.2rem; margin: 0 0 10px; color: var(--ink); }
        .menu-card p { color: var(--muted); margin-bottom: 25px; font-size: 1.1rem; }

        .toggle-group { display: inline-flex; background: var(--bg-top); border-radius: 999px; overflow: hidden; border: 2px solid var(--teal); margin-bottom: 25px; }
        .toggle-btn { background: transparent; border: none; padding: 10px 20px; font-family: 'Baloo 2', sans-serif; font-weight: 700; color: var(--ink); cursor: pointer; transition: background 0.2s, color 0.2s; font-size: 1.1rem; }
        .toggle-btn.active { background: var(--teal); color: white; }

        .btn-grid { display: grid; gap: 15px; width: 100%; }

        /* ---------- GAME UI ---------- */
        .status-bar {
            background: white; padding: 12px 25px; border-radius: 999px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;
            gap: 20px; margin-bottom: 20px; width: 100%; flex-wrap: wrap;
        }

        .role-badge { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1.1rem; padding: 6px 16px; border-radius: 999px; border: 2px solid var(--muted); display: none; }
        .turn-indicator { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.2rem; padding: 6px 20px; border-radius: 999px; background: var(--muted); color: white; transition: background 0.3s; }

        .board-container {
            width: 100%; max-width: 650px; background: rgba(45, 49, 66, 0.05); padding: 12px;
            border-radius: 12px; box-shadow: inset 0 4px 15px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.05);
            overflow-x: auto; /* Scrollable on tiny phones */
        }
        .board { display: grid; width: 100%; aspect-ratio: 1/1; min-width: 300px; }

        .cell {
            background: white; aspect-ratio: 1; border-radius: 4px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 0 rgba(45, 49, 66, 0.08); transition: transform 0.1s, background 0.3s; position: relative;
        }
        .cell:hover:not(.occupied) { transform: translateY(-1px); background: #FAFAFA; }
        .cell.occupied { cursor: default; }

        .cell svg { width: 75%; height: 75%; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cell.winner { background: var(--yellow); animation: pulseWin 1s infinite alternate; z-index: 2; }
        .cell.last-move::after { content: ""; position: absolute; width: 15%; height: 15%; background: var(--purple-deep); border-radius: 50%; opacity: 0.6; }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseWin { 0% { transform: scale(1); } 100% { transform: scale(1.1); box-shadow: 0 10px 20px rgba(255, 217, 61, 0.8); } }

        /* ---------- GENERAL BUTTONS ---------- */
        .controls { margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .game-btn {
            background: white; border: none; color: var(--ink); font-family: 'Baloo 2', sans-serif;
            font-weight: 700; font-size: 1.1rem; padding: 12px 24px; border-radius: 999px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(45, 49, 66, 0.1); transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .game-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(45, 49, 66, 0.1); }
        .game-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(45, 49, 66, 0.1); }
        
        .game-btn.primary { background: var(--coral); color: white; box-shadow: 0 4px 0 var(--coral-deep); }
        .game-btn.secondary { background: var(--purple); color: white; box-shadow: 0 4px 0 var(--purple-deep); }
        .game-btn.success { background: var(--green); color: white; box-shadow: 0 4px 0 var(--green-deep); }
        .game-btn.online { background: var(--teal); color: white; box-shadow: 0 4px 0 var(--teal-deep); }

        /* ---------- MODALS & EXTRAS ---------- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(45, 49, 66, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: white; border-radius: 30px; padding: 35px 30px; max-width: 450px; width: 90%; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-card h2 { font-family: 'Baloo 2', sans-serif; font-size: 2.2rem; margin: 0 0 10px; }
        .modal-card p { color: var(--muted); font-size: 1.1rem; margin-bottom: 25px; }

        .share-box { background: var(--bg-top); border: 2px dashed var(--teal); border-radius: 15px; padding: 15px; margin: 20px 0; font-weight: 600; color: var(--teal-deep); word-break: break-all; }
        .lobby-error { color: var(--coral-deep); background: rgba(225, 78, 86, 0.1); padding: 10px; border-radius: 10px; margin-bottom: 20px; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Hub
        </a>
        <h1>Ultimate Gomoku (5-in-a-Row)</h1>
        <div style="width: 80px;"></div>
    </header>

    <!-- SCREEN 1: MAIN MENU -->
    <div class="screen active" id="screen-menu">
        <div class="menu-card">
            <h2>Select Grid Size</h2>
            <div class="toggle-group" id="size-group">
                <button class="toggle-btn active" data-val="10">10 x 10</button>
                <button class="toggle-btn" data-val="15">15 x 15</button>
                <button class="toggle-btn" data-val="20">20 x 20</button>
            </div>
            
            <h2>Choose Mode</h2>
            <div class="btn-grid">
                <button class="game-btn primary" id="btn-mode-local">🧑‍🤝‍🧑 Pass & Play (Local)</button>
                <button class="game-btn secondary" id="btn-mode-ai">🤖 Play Vs Computer</button>
                <button class="game-btn online" id="btn-mode-online">🌍 Play Online (Multiplayer)</button>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: ONLINE LOBBY -->
    <div class="screen" id="screen-online-lobby">
        <div class="menu-card">
            <h2>Online Multiplayer</h2>
            <div id="lobby-error" class="lobby-error"></div>

            <div id="lobby-create-ui">
                <p>Create a room and invite a friend to play!</p>
                <button class="game-btn online" style="width: 100%;" id="btn-create-room">✨ Create Room</button>
                <button class="game-btn" style="width: 100%; margin-top: 10px;" id="btn-back-main">🔙 Back to Menu</button>
            </div>

            <div id="lobby-join-ui" style="display: none;">
                <div class="share-box">
                    <span id="room-code-display" style="font-size: 1.5rem; letter-spacing: 2px;"></span><br>
                    <span style="font-size: 0.9rem; font-weight: 400;">Share this link with your opponent:</span><br>
                    <input type="text" id="share-link" readonly style="width: 100%; text-align: center; margin-top: 10px; padding: 8px; border: 1px solid var(--teal); border-radius: 5px; outline: none;">
                </div>
                
                <button class="game-btn success" id="btn-copy-link" style="margin-bottom: 25px;">🔗 Copy Link</button>
                
                <hr style="border: 0; border-top: 1px solid #E2E8F0; margin-bottom: 20px;">
                <p style="margin-bottom: 10px;"><strong>Join this room as:</strong></p>
                
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button class="game-btn primary" id="btn-join-x">Player X (First)</button>
                    <button class="game-btn secondary" id="btn-join-o">Player O (Second)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: GAME BOARD -->
    <div class="screen" id="screen-game">
        <div class="status-bar">
            <div class="role-badge" id="my-role-badge"></div>
            <div class="turn-indicator" id="turn-badge">Loading...</div>
        </div>

        <div class="board-container">
            <div class="board" id="board"></div>
        </div>

        <div class="controls">
            <button class="game-btn primary" id="btn-restart">🔄 Restart Game</button>
            <button class="game-btn" id="btn-rules">❓ Instructions</button>
            <button class="game-btn" id="btn-quit" style="background: var(--bg-top);">🔙 Main Menu</button>
        </div>
    </div>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-card">
            <h2 id="modal-title">Notice</h2>
            <p id="modal-desc"></p>
            <button class="game-btn primary" style="margin: 0 auto;" id="modal-close-btn">Got It!</button>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdQTK8tSHhnla5LePBKb0EgGHUWchkNbQ",
            authDomain: "math-bdf5e.firebaseapp.com",
            databaseURL: "https://math-bdf5e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "math-bdf5e",
            storageBucket: "math-bdf5e.firebasestorage.app",
            messagingSenderId: "515958917799",
            appId: "1:515958917799:web:5e85a5dfabbce1e5a62982",
            measurementId: "G-H9J3GMHCK8"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GLOBAL STATE ---
        let currentMode = 'local'; // 'local', 'ai', 'online'
        let gridSize = 10;
        
        // Local/AI State
        let board = [];
        let currentPlayer = 'X';
        let isGameActive = false;
        let lastMoveIndex = -1;

        // Online State
        let roomId = null;
        let myRole = null; 
        let dbRef = null;
        let onlineState = null;

        // --- DOM ELEMENTS ---
        const screens = {
            menu: document.getElementById('screen-menu'),
            onlineLobby: document.getElementById('screen-online-lobby'),
            game: document.getElementById('screen-game')
        };
        const sizeBtns = document.querySelectorAll('#size-group .toggle-btn');
        const boardEl = document.getElementById('board');
        const turnBadge = document.getElementById('turn-badge');
        const roleBadge = document.getElementById('my-role-badge');
        
        // Modals
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // --- NAVIGATION ROUTING ---
        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            roomId = urlParams.get('room');
            currentMode = 'online';
            document.getElementById('lobby-create-ui').style.display = 'none';
            document.getElementById('lobby-join-ui').style.display = 'block';
            document.getElementById('room-code-display').innerText = "Room Code: " + roomId;
            document.getElementById('share-link').value = window.location.href;
            switchScreen('onlineLobby');
        }

        // --- MAIN MENU LOGIC ---
        sizeBtns.forEach(btn => btn.addEventListener('click', (e) => {
            sizeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            gridSize = parseInt(e.target.dataset.val);
        }));

        document.getElementById('btn-mode-local').addEventListener('click', () => {
            currentMode = 'local';
            initLocalGame();
            switchScreen('game');
        });

        document.getElementById('btn-mode-ai').addEventListener('click', () => {
            currentMode = 'ai';
            initLocalGame();
            switchScreen('game');
        });

        document.getElementById('btn-mode-online').addEventListener('click', () => {
            currentMode = 'online';
            switchScreen('onlineLobby');
        });

        document.getElementById('btn-back-main').addEventListener('click', () => switchScreen('menu'));
        document.getElementById('btn-quit').addEventListener('click', () => {
            // Clean URL if leaving online room
            if(currentMode === 'online') window.history.pushState({}, '', window.location.pathname);
            switchScreen('menu');
        });

        // --- ONLINE LOBBY LOGIC ---
        document.getElementById('btn-create-room').addEventListener('click', async () => {
            roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
            const initialState = {
                gridSize: gridSize,
                board: Array(gridSize * gridSize).fill('E'),
                turn: 'X',
                winner: 'None',
                lastMove: -1
            };
            dbRef = ref(db, 'rooms/' + roomId);
            await set(dbRef, initialState);
            
            const newUrl = window.location.pathname + '?room=' + roomId;
            window.history.pushState({path:newUrl}, '', newUrl);
            
            document.getElementById('lobby-create-ui').style.display = 'none';
            document.getElementById('lobby-join-ui').style.display = 'block';
            document.getElementById('room-code-display').innerText = "Room Code: " + roomId;
            document.getElementById('share-link').value = window.location.href;
        });

        document.getElementById('btn-copy-link').addEventListener('click', () => {
            document.getElementById('share-link').select();
            document.execCommand('copy');
            showModal("Link Copied!", "Send this link to your opponent.");
        });

        document.getElementById('btn-join-x').addEventListener('click', () => joinOnlineGame('X'));
        document.getElementById('btn-join-o').addEventListener('click', () => joinOnlineGame('O'));

        async function joinOnlineGame(role) {
            dbRef = ref(db, 'rooms/' + roomId);
            const snapshot = await get(dbRef);
            
            if (!snapshot.exists()) {
                document.getElementById('lobby-error').innerText = "Room not found.";
                document.getElementById('lobby-error').style.display = 'block';
                return;
            }

            myRole = role;
            roleBadge.style.display = 'block';
            roleBadge.innerText = `You are: Player ${myRole}`;
            roleBadge.style.color = myRole === 'X' ? 'var(--coral-deep)' : 'var(--teal-deep)';
            roleBadge.style.borderColor = myRole === 'X' ? 'var(--coral)' : 'var(--teal)';
            
            switchScreen('game');
            
            onValue(dbRef, (snap) => {
                const data = snap.val();
                if (data) syncOnlineState(data);
                else {
                    showModal("Connection Lost", "The room was deleted.");
                    setTimeout(() => window.location.href = window.location.pathname, 2000);
                }
            });
        }

        // --- CORE GAME ENGINE ---
        const getSvgX = (size) => `<svg viewBox="0 0 100 100" stroke="var(--coral-deep)" stroke-width="${size===10?14:(size===15?16:20)}" stroke-linecap="round"><line x1="20" y1="20" x2="80" y2="80"/><line x1="80" y1="20" x2="20" y2="80"/></svg>`;
        const getSvgO = (size) => `<svg viewBox="0 0 100 100" fill="none" stroke="var(--teal-deep)" stroke-width="${size===10?14:(size===15?16:20)}" stroke-linecap="round"><circle cx="50" cy="50" r="35"/></svg>`;

        function initLocalGame() {
            roleBadge.style.display = 'none';
            boardEl.innerHTML = '';
            board = Array(gridSize * gridSize).fill('E');
            currentPlayer = 'X';
            isGameActive = true;
            lastMoveIndex = -1;

            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gap = gridSize === 20 ? '2px' : '4px';

            for (let i = 0; i < board.length; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                boardEl.appendChild(cell);
            }
            updateTurnUI(currentPlayer, 'None');
        }

        function handleCellClick(index) {
            if (currentMode === 'online') {
                if (!onlineState || onlineState.turn !== myRole || onlineState.winner !== 'None' || onlineState.board[index] !== 'E') return;
                
                // Optimistic Local Update
                onlineState.board[index] = myRole;
                onlineState.lastMove = index;
                
                const winCells = checkWin(index, myRole, onlineState.board, onlineState.gridSize);
                let newWinner = 'None';
                if (winCells) newWinner = myRole;
                else if (!onlineState.board.includes('E')) newWinner = 'Draw';

                update(dbRef, { board: onlineState.board, turn: myRole === 'X' ? 'O' : 'X', lastMove: index, winner: newWinner });
            } 
            else {
                // Local or AI Mode
                if (!isGameActive || board[index] !== 'E') return;
                executeLocalMove(index, currentPlayer);

                if (isGameActive && currentMode === 'ai' && currentPlayer === 'O') {
                    isGameActive = false;
                    turnBadge.innerHTML = `🤖 AI Thinking...`;
                    turnBadge.style.background = `var(--muted)`;
                    setTimeout(() => {
                        isGameActive = true;
                        const aiMove = getBestMoveGomoku();
                        if(aiMove !== -1) executeLocalMove(aiMove, 'O');
                    }, 500);
                }
            }
        }

        function executeLocalMove(index, player) {
            board[index] = player;
            if (lastMoveIndex !== -1) boardEl.children[lastMoveIndex].classList.remove('last-move');
            lastMoveIndex = index;

            const cell = boardEl.children[index];
            cell.classList.add('occupied', 'last-move');
            cell.innerHTML = player === 'X' ? getSvgX(gridSize) : getSvgO(gridSize);

            const winCells = checkWin(index, player, board, gridSize);
            if (winCells) {
                isGameActive = false;
                winCells.forEach(idx => boardEl.children[idx].classList.add('winner'));
                updateTurnUI(player, player);
                triggerEndModal(player);
            } else if (!board.includes('E')) {
                isGameActive = false;
                updateTurnUI(player, 'Draw');
                triggerEndModal('Draw');
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateTurnUI(currentPlayer, 'None');
            }
        }

        // Online Sync Renderer
        function syncOnlineState(newState) {
            const isFirstLoad = !onlineState;
            onlineState = newState;
            gridSize = onlineState.gridSize; // Inherit room's size

            if (isFirstLoad) {
                boardEl.innerHTML = '';
                boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
                boardEl.style.gap = gridSize === 20 ? '2px' : '4px';
                for (let i = 0; i < gridSize * gridSize; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.index = i;
                    cell.addEventListener('click', () => handleCellClick(i));
                    boardEl.appendChild(cell);
                }
            }

            // Sync visual board
            for (let i = 0; i < onlineState.board.length; i++) {
                const val = onlineState.board[i];
                const cell = boardEl.children[i];
                cell.className = 'cell'; cell.innerHTML = '';
                if (val !== 'E') {
                    cell.classList.add('occupied');
                    cell.innerHTML = val === 'X' ? getSvgX(gridSize) : getSvgO(gridSize);
                }
                if (onlineState.lastMove === i) cell.classList.add('last-move');
            }

            if (onlineState.winner !== 'None' && onlineState.winner !== 'Draw') {
                const winCells = checkWin(onlineState.lastMove, onlineState.winner, onlineState.board, gridSize);
                if (winCells) winCells.forEach(idx => boardEl.children[idx].classList.add('winner'));
                if(!isFirstLoad) triggerEndModal(onlineState.winner);
            } else if (onlineState.winner === 'Draw' && !isFirstLoad) {
                triggerEndModal('Draw');
            }

            updateTurnUI(onlineState.turn, onlineState.winner);
        }

        // UI Helpers
        function updateTurnUI(activeTurn, winner) {
            if (winner !== 'None') {
                if(currentMode === 'online') {
                    turnBadge.innerText = winner === myRole ? "🏆 You Won!" : (winner === 'Draw' ? "🤝 Draw!" : "❌ You Lost!");
                    turnBadge.style.background = winner === myRole ? "var(--green)" : (winner === 'Draw' ? "var(--muted)" : "var(--coral)");
                } else {
                    turnBadge.innerText = winner === 'Draw' ? "🤝 Draw!" : `🏆 ${winner} Wins!`;
                    turnBadge.style.background = winner === 'Draw' ? "var(--muted)" : "var(--yellow)";
                    turnBadge.style.color = "var(--ink)";
                }
            } else {
                turnBadge.style.color = "white";
                if(currentMode === 'online') {
                    const isMyTurn = activeTurn === myRole;
                    turnBadge.innerText = isMyTurn ? "Your Turn!" : "Opponent's Turn...";
                    turnBadge.style.background = isMyTurn ? (myRole === 'X' ? 'var(--coral)' : 'var(--teal)') : "var(--muted)";
                } else {
                    turnBadge.innerHTML = activeTurn === 'X' ? `<span style="font-size: 1.5rem;">✖️</span> X's Turn` : `<span style="font-size: 1.5rem;">⭕</span> O's Turn`;
                    turnBadge.style.background = activeTurn === 'X' ? 'var(--coral)' : 'var(--teal)';
                }
            }
        }

        function triggerEndModal(winner) {
            if(currentMode === 'online') {
                if (winner === myRole) showModal("🎉 Victory!", "You connected 5 in a row!", true);
                else if (winner === 'Draw') showModal("Stalemate!", "The board is full.", true);
                else showModal("Game Over", "Your opponent connected 5 in a row.", true);
            } else if (currentMode === 'ai') {
                if (winner === 'O') showModal("Computer Wins!", "The AI outsmarted you.", true);
                else if (winner === 'Draw') showModal("Draw!", "No winner this time.", true);
                else showModal("🎉 You Win!", "You beat the computer!", true);
            } else {
                if (winner === 'Draw') showModal("Draw!", "No winner this time.", true);
                else showModal(`🎉 Player ${winner} Wins!`, `A brilliant display of strategy!`, true);
            }
        }

        function showModal(title, desc, isGameOver = false) {
            modalTitle.innerText = title; modalDesc.innerHTML = desc;
            if(isGameOver) {
                modalCloseBtn.innerText = "Play Again";
                modalCloseBtn.onclick = () => { modal.classList.remove('active'); restartGame(); };
            } else {
                modalCloseBtn.innerText = "Got It!";
                modalCloseBtn.onclick = () => modal.classList.remove('active');
            }
            setTimeout(() => modal.classList.add('active'), 400);
        }

        // --- SHARED LOGIC ---
        document.getElementById('btn-restart').addEventListener('click', restartGame);
        
        function restartGame() {
            if(currentMode === 'online' && dbRef && onlineState) {
                update(dbRef, { board: Array(gridSize * gridSize).fill('E'), turn: 'X', winner: 'None', lastMove: -1 });
            } else {
                initLocalGame();
            }
        }

        document.getElementById('btn-rules').addEventListener('click', () => {
            showModal("How to Play", `Take turns placing pieces. First to connect exactly <strong>5 in a row</strong> (horizontally, vertically, or diagonally) wins!`);
        });

        // 5-in-a-row Check Algorithm
        function checkWin(index, player, boardArr, size) {
            if (index < 0) return null;
            const r = Math.floor(index / size);
            const c = index % size;
            const directions = [ [0, 1], [1, 0], [1, 1], [1, -1] ];

            for (let [dr, dc] of directions) {
                let count = 1; let cells = [index];
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < size && nc >= 0 && nc < size && boardArr[nr * size + nc] === player) {
                    cells.push(nr * size + nc); count++; nr += dr; nc += dc;
                }
                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < size && nc >= 0 && nc < size && boardArr[nr * size + nc] === player) {
                    cells.push(nr * size + nc); count++; nr -= dr; nc -= dc;
                }
                if (count >= 5) return cells; 
            }
            return null;
        }

        // --- AI LOGIC (Heuristic) ---
        function getBestMoveGomoku() {
            let bestScore = -Infinity; let bestMoves = [];
            let candidateCells = new Set();
            
            for (let i = 0; i < board.length; i++) {
                if (board[i] !== 'E') {
                    const r = Math.floor(i / gridSize); const c = i % gridSize;
                    for (let dr = -2; dr <= 2; dr++) {
                        for (let dc = -2; dc <= 2; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
                                let nIdx = nr * gridSize + nc;
                                if (board[nIdx] === 'E') candidateCells.add(nIdx);
                            }
                        }
                    }
                }
            }
            
            if (candidateCells.size === 0) return Math.floor((gridSize*gridSize)/2) + Math.floor(gridSize/2);

            for (let idx of candidateCells) {
                let attackScore = evaluateCell(idx, 'O');
                let defenseScore = evaluateCell(idx, 'X');
                let totalScore = attackScore + (defenseScore * 0.9);

                if (totalScore > bestScore) { bestScore = totalScore; bestMoves = [idx]; } 
                else if (totalScore === bestScore) { bestMoves.push(idx); }
            }
            return bestMoves[Math.floor(Math.random() * bestMoves.length)];
        }

        function evaluateCell(index, player) {
            const r = Math.floor(index / gridSize); const c = index % gridSize;
            const directions = [ [0, 1], [1, 0], [1, 1], [1, -1] ];
            let cellScore = 0;

            for (let [dr, dc] of directions) {
                let consecutive = 1; let openEnds = 0;
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && board[nr * gridSize + nc] === player) {
                    consecutive++; nr += dr; nc += dc;
                }
                if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && board[nr * gridSize + nc] === 'E') openEnds++;

                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && board[nr * gridSize + nc] === player) {
                    consecutive++; nr -= dr; nc -= dc;
                }
                if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && board[nr * gridSize + nc] === 'E') openEnds++;

                if (consecutive >= 5) cellScore += 100000; 
                else if (consecutive === 4 && openEnds === 2) cellScore += 50000; 
                else if (consecutive === 4 && openEnds === 1) cellScore += 10000; 
                else if (consecutive === 3 && openEnds === 2) cellScore += 5000;  
                else if (consecutive === 3 && openEnds === 1) cellScore += 500;   
                else if (consecutive === 2 && openEnds === 2) cellScore += 100;   
            }
            return cellScore;
        }
