<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Defense</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .status-panel {
            background-color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        #turn-indicator {
            font-size: 20px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 5px;
        }
        #phase-indicator {
            font-size: 14px;
            color: #7f8c8d;
            font-style: italic;
        }
        .board-container {
            position: relative;
            margin-bottom: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 2px;
            background-color: #34495e;
            border: 4px solid #34495e;
            border-radius: 4px;
        }
        .cell {
            background-color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .cell:hover {
            background-color: #bdc3c7;
        }
        /* The Penny */
        .penny {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #e6a87c, #b87333);
            border-radius: 50%;
            border: 2px solid #8c5226;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            pointer-events: none; /* Let the cell handle the click */
            transition: transform 0.2s;
        }
        /* Selection Highlight */
        .cell.selected {
            background-color: #aed6f1;
        }
        .cell.selected .penny {
            transform: scale(1.1);
            box-shadow: 0 0 10px 4px #3498db;
        }
        
        /* Symmetry Lines Overlay */
        #symmetry-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none;
        }
        .sym-line {
            position: absolute;
            background-color: rgba(46, 204, 113, 0.8);
            box-shadow: 0 0 8px rgba(46, 204, 113, 1);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #2c3e50;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #555;
        }
        
        /* Win Banner */
        #win-banner {
            display: none;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: popIn 0.5s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Symmetry Defense</h1>
        <p><strong>Goal:</strong> Player 1 tries to create line symmetry with 8 pennies. Player 2 tries to prevent it.</p>
    </div>

    <div id="win-banner"></div>

    <div class="status-panel">
        <div id="turn-indicator">Player 1's Turn</div>
        <div id="phase-indicator">Phase: Placing Pennies (0/8)</div>
    </div>

    <div class="board-container">
        <div class="board" id="board">
            <!-- 16 cells generated by JS -->
        </div>
        <div id="symmetry-overlay"></div>
    </div>

    <div class="controls">
        <button onclick="resetGame()">Reset Game</button>
        <div class="toggle-container">
            <input type="checkbox" id="limitless-toggle" onchange="resetGame()">
            <label for="limitless-toggle">Limitless Variation (No 4-move limit)</label>
        </div>
    </div>

<script>
    // Game State
    let grid = Array(4).fill().map(() => Array(4).fill(0));
    let phase = 'placing'; // 'placing', 'moving', 'gameOver'
    let currentPlayer = 1;
    let penniesPlaced = 0;
    let p1Moves = 0;
    let selectedCell = null;
    let lastMove = null; // { fromR, fromC, toR, toC }

    // DOM Elements
    const boardEl = document.getElementById('board');
    const turnInd = document.getElementById('turn-indicator');
    const phaseInd = document.getElementById('phase-indicator');
    const winBanner = document.getElementById('win-banner');
    const symOverlay = document.getElementById('symmetry-overlay');
    const limitlessToggle = document.getElementById('limitless-toggle');

    // Initialize Board
    function initBoard() {
        boardEl.innerHTML = '';
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.addEventListener('click', () => handleCellClick(r, c));
                boardEl.appendChild(cell);
            }
        }
    }

    function render() {
        // Update Grid UI
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            const r = parseInt(cell.dataset.r);
            const c = parseInt(cell.dataset.c);
            
            // Render Penny
            if (grid[r][c] === 1) {
                if (!cell.hasChildNodes()) {
                    const penny = document.createElement('div');
                    penny.className = 'penny';
                    cell.appendChild(penny);
                }
            } else {
                cell.innerHTML = '';
            }

            // Render Selection
            if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                cell.classList.add('selected');
            } else {
                cell.classList.remove('selected');
            }
        });

        // Update Text
        if (phase !== 'gameOver') {
            turnInd.innerText = `Player ${currentPlayer}'s Turn`;
            if (phase === 'placing') {
                phaseInd.innerText = `Phase: Placing Pennies (${penniesPlaced}/8)`;
            } else if (phase === 'moving') {
                let movesText = limitlessToggle.checked ? "(Limitless)" : `(P1 Moves: ${p1Moves}/4)`;
                phaseInd.innerText = `Phase: Moving Pennies ${movesText}`;
            }
        }
    }

    function handleCellClick(r, c) {
        if (phase === 'gameOver') return;

        if (phase === 'placing') {
            if (grid[r][c] === 0) {
                grid[r][c] = 1;
                penniesPlaced++;
                
                if (penniesPlaced === 8) {
                    // Check for an instant win off the final placement
                    let sym = checkSymmetry();
                    if (sym) {
                        endGame(1, sym);
                        return;
                    }
                    // Transition to Moving phase
                    phase = 'moving';
                    currentPlayer = 2; // Rule: Player 2 goes first in moving phase
                    selectedCell = null;
                } else {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                }
                render();
            }
        } 
        else if (phase === 'moving') {
            if (grid[r][c] === 1) {
                // Select a penny
                selectedCell = { r, c };
                render();
            } else if (grid[r][c] === 0 && selectedCell) {
                // Attempt to move selected penny to empty cell
                
                // Rule check: No undoing exact previous move
                if (lastMove && 
                    selectedCell.r === lastMove.toR && selectedCell.c === lastMove.toC && 
                    r === lastMove.fromR && c === lastMove.fromC) {
                    alert("Illegal Move: You cannot undo the previous player's move!");
                    return;
                }

                // Execute Move
                grid[selectedCell.r][selectedCell.c] = 0;
                grid[r][c] = 1;
                
                // Track Move
                lastMove = { fromR: selectedCell.r, fromC: selectedCell.c, toR: r, toC: c };
                if (currentPlayer === 1) p1Moves++;
                
                selectedCell = null;
                
                // Check Win Conditions
                let sym = checkSymmetry();
                if (sym) {
                    endGame(1, sym); // P1 wins if ANY symmetry is found
                    return;
                }
                
                if (!limitlessToggle.checked && currentPlayer === 1 && p1Moves >= 4) {
                    endGame(2, null); // P2 wins if no symmetry by P1's 4th move
                    return;
                }

                // Switch turn
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                render();
            }
        }
    }

    // Mathematical check for line symmetry on a 4x4 boolean grid
    function checkSymmetry() {
        if (penniesPlaced < 8) return false;

        let vSym = true, hSym = true, d1Sym = true, d2Sym = true;
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                if (grid[r][c] !== grid[r][3 - c]) vSym = false;
                if (grid[r][c] !== grid[3 - r][c]) hSym = false;
                if (grid[r][c] !== grid[c][r]) d1Sym = false;
                if (grid[r][c] !== grid[3 - c][3 - r]) d2Sym = false;
            }
        }

        if (vSym) return 'vertical';
        if (hSym) return 'horizontal';
        if (d1Sym) return 'diagonal-main'; // \
        if (d2Sym) return 'diagonal-anti'; // /
        return false;
    }

    function endGame(winner, symType) {
        phase = 'gameOver';
        render(); // Final visual update
        
        winBanner.style.display = 'block';
        if (winner === 1) {
            winBanner.style.backgroundColor = '#2ecc71';
            winBanner.innerHTML = "🎉 Player 1 Wins! Symmetry Achieved! 🎉";
            drawSymmetryLine(symType);
        } else {
            winBanner.style.backgroundColor = '#e74c3c';
            winBanner.innerHTML = "🛡️ Player 2 Wins! Defense Successful! 🛡️";
        }
        
        turnInd.innerText = "Game Over";
        phaseInd.innerText = "";
    }

    function drawSymmetryLine(type) {
        symOverlay.style.display = 'block';
        symOverlay.innerHTML = ''; // Clear previous
        
        const line = document.createElement('div');
        line.className = 'sym-line';

        // 4x4 Grid dimensions: 320px width/height + 8px gap total (approx 328px)
        if (type === 'vertical') {
            line.style.width = '6px';
            line.style.height = '100%';
            line.style.left = '50%';
            line.style.transform = 'translateX(-50%)';
            line.style.top = '0';
        } else if (type === 'horizontal') {
            line.style.height = '6px';
            line.style.width = '100%';
            line.style.top = '50%';
            line.style.transform = 'translateY(-50%)';
            line.style.left = '0';
        } else if (type === 'diagonal-main') {
            line.style.height = '6px';
            line.style.width = '141%'; // √2 * 100
            line.style.top = '50%';
            line.style.left = '50%';
            line.style.transform = 'translate(-50%, -50%) rotate(45deg)';
        } else if (type === 'diagonal-anti') {
            line.style.height = '6px';
            line.style.width = '141%';
            line.style.top = '50%';
            line.style.left = '50%';
            line.style.transform = 'translate(-50%, -50%) rotate(-45deg)';
        }
        symOverlay.appendChild(line);
    }

    function resetGame() {
        grid = Array(4).fill().map(() => Array(4).fill(0));
        phase = 'placing';
        currentPlayer = 1;
        penniesPlaced = 0;
        p1Moves = 0;
        selectedCell = null;
        lastMove = null;
        
        winBanner.style.display = 'none';
        symOverlay.style.display = 'none';
        
        initBoard();
        render();
    }

    // Start the game
    initBoard();
    render();
</script>

</body>
</html>
